<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบนัดหมาย</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://static.line-scdn.net/liff/edge/2.1/sdk.js"></script>
    <style>
        .selected {
            background-color: #283448 !important;
            color: white;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgb(30 41 59 0.8);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .loading-spinner {
            border: 16px solid #aaaaaa;
            border-radius: 50%;
            border-top: 16px solid #1e293b;
            width: 120px;
            height: 120px;
            animation: spin 2s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .popup {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgb(30 41 59 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            display: none;
        }
        .popup-content {
            background: white;
            padding: 50px;
            border-radius: 8px;
            text-align: left;
            width: 80%;
        }
        #loadingOverlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgb(30 41 59 0.8);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .loading-container { position: relative; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .blink { animation: blink 1s infinite; }
    </style>
</head>
<body class="bg-slate-100 flex flex-col min-h-screen">
    <!-- ส่วนหัวของหน้า -->
    <div class="bg-gradient-to-r from-slate-900 to-slate-700 text-white p-10">
        <h1 class="text-xl font-bold">จองคิวงาน ยอดหญ้า</h1>
        <p class="text-sm"></p>
    </div>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
    </div>
    <div class="popup" id="popup">
        <div class="max-w-md popup-content mx-auto" id="popupContent"></div>
    </div>
    
    <div class=" w-full mx-auto rounded py-4 px-4 mb-4">
        <form id="bookingForm" class="space-y-2 pt-2" novalidate>
            <input type="hidden" name="action" value="makeBooking">

            <!-- ฟอร์มการจอง (Step 1) -->
            <div id="step1" class="max-w-sm mx-auto">
                <!-- เลือกบริการ -->
                <div class="flex mb-4">
                    <span class="bg-white flex items-center border rounded-2xl p-2 w-24">
                        <img src="https://img.icons8.com/?size=100&id=22128&format=png&color=000000" class="w-6 h-6 mr-1">
                        <span class="text-black"> บริการ </span>
                    </span>
                    <select id="service" name="service" class="rounded-2xl bg-white border text-gray-900 block flex-1 min-w-0 w-full" placeholder="ตัวเลือกบริการ"></select>
                </div>
                <!-- เลือกสถานที่ -->
                <div class="flex mb-4">
                    <span class="bg-white flex items-center border rounded-2xl p-2 w-24">
                        <img src="https://img.icons8.com/?size=100&id=Ynh2i0jcHfB4&format=png&color=000000" class="w-6 h-6 mr-1">
                        <span class="text-black"> สาขา </span>
                    </span>
                    <select id="locationservice" name="locationservice" class="rounded-2xl bg-white border text-gray-900 block flex-1 min-w-0 w-full" placeholder="ตัวเลือกสถานที่"></select>
                </div>
                <!-- ฟอร์มข้อมูลผู้ใช้ -->
                <div class="bg-slate-300 px-4 py-4 my-4 rounded-2xl">
                    <input type="hidden" id="displayName" name="displayName">
                    <div class="loading-container">
                        <div id="loadingOverlay">
                            <div class="text-center text-white">ค้นหารายชื่อ..</div>
                        </div>
                        <div class="pb-4">ฟอร์มข้อมูล</div>
                        <div class="flex justify-center items-center">
                            <div class="max-w-md">
                                <!-- ฟิลด์ชื่อ-สกุล -->
                                <div class="flex mb-6">
                                    <span class="text-center bg-slate-800 rounded-2xl mr-2 p-2 w-32"><span class="text-white text-sm">ชื่อ</span></span>
                                    <input type="text" id="name" name="name" class="w-full p-2 shadow-sm rounded-2xl">
                                </div>
                                <!-- ฟิลด์เบอร์ติดต่อ -->
                                <div class="flex  mb-6">
                                    <span class="text-center bg-slate-800 rounded-2xl mr-2 p-2 w-32"><span class="text-white text-sm">เบอร์ติดต่อ</span></span>
                                    <input type="tel" id="phonenumber" name="phonenumber" class="w-full p-2 shadow-sm rounded-2xl">
                                </div>
                                <!-- ฟิลด์หมายเหตุ -->
                                <div class="flex">
                                    <span class="text-center bg-slate-800 rounded-2xl mr-2 p-2 w-32"><span class="text-white text-sm">ข้อมูลที่อยู่</span></span>
                                    <input type="text" id="note" name="note" class="w-full p-2 shadow-sm rounded-2xl">
                                </div>
                                <input type="hidden" id="userlineid" name="userlineid">
                            </div>
                        </div>
                    </div>
                </div>
                <div id="buttons" class="">
                    <button type="button" onclick="nextStep()" class="w-full bg-slate-800 text-white py-3 mt-4 rounded-2xl">ถัดไป</button>
                </div>
            </div>

            <!-- ฟอร์มการเลือกวันที่และเวลา (Step 2) -->
            <div id="step2" class="grid gap-4 max-w-sm mx-auto" style="display:none;">
                <div class="text-center font-semibold mb-6">
                    <!-- ตัวเลือกเดือนและปี -->
                    <div class="flex justify-center space-x-2">
                        <select id="monthSelect" aria-label="Month" class="text-center bg-white text-black w-1/2 border-2 border-slate-800 rounded-2xl px-2 py-4">
                            <option value="0">มกราคม</option>
                            <option value="1">กุมภาพันธ์</option>
                            <option value="2">มีนาคม</option>
                            <option value="3">เมษายน</option>
                            <option value="4">พฤษภาคม</option>
                            <option value="5">มิถุนายน</option>
                            <option value="6">กรกฎาคม</option>
                            <option value="7">สิงหาคม</option>
                            <option value="8">กันยายน</option>
                            <option value="9">ตุลาคม</option>
                            <option value="10">พฤศจิกายน</option>
                            <option value="11">ธันวาคม</option>
                        </select>
                        <select id="yearSelect" aria-label="Year" class="text-center bg-white text-black w-1/2 border-2 border-slate-800 rounded-2xl px-2 py-4"></select>
                    </div>
                </div>
                <div class="overflow-x-auto mb-4 no-scrollbar">
                    <div id="calendarDays" class="flex space-x-2"></div>
                </div>
                <div id="availability" class="max-w-sm mx-auto space-y-2"></div>
              
                <div class="hidden">
                    <label for="time" class="block text-sm">Time:</label>
                    <input type="time" id="time" name="time" required readonly class="w-full px-3 py-3 border border-blue-900 rounded-2xl">
                </div>
                <div class="hidden text-center">
                    <input type="submit" value="Submit" class="px-6 py-4 bg-slate-800 text-black font-semibold rounded-2xl">
                </div>
                <button type="button" onclick="prevStep()" class="w-32 p-2 mt-5 bg-white text-slate-800 py-3 rounded-2xl">กลับหน้าหลัก</button>
            </div>
        </form>

        <script>
  document.addEventListener('DOMContentLoaded', async () => {
    await liff.init({ liffId: "2006389089-vKl4jzk9" }); // ✅ ใช้ LIFF ID จริงของคุณ

    if (!liff.isLoggedIn()) {
      liff.login(); // เข้าสู่ระบบอัตโนมัติถ้ายังไม่ login
      return;
    }

    try {
      const profile = await liff.getProfile();
      const nameInput = document.getElementById('name');
      if (nameInput) {
        nameInput.value = profile.displayName;
        nameInput.readOnly = true; // ไม่ให้แก้ไข
      }
    } catch (err) {
      console.error("เกิดข้อผิดพลาดในการโหลดชื่อจาก LINE:", err);
    }
  });
</script>
        
    </div>

    <script>
        // ตัวแปรสำหรับใช้กับ URL ของ Web App และ LIFF
        let WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwoIEng-LzM9R0kIZIqOIXEXuWx7M9FdDB2BRHCWWduKoi6XrXk6cXK3rEoKdw2xw5Tdw/exec';
        const WEB_APP_MEMBER_URL = 'https://script.google.com/macros/s/AKfycbxOSzL_UVqKXRzh0eZ-Y4xbAxyXpnZPMO1OGdl8SQCSwKvEAvUc6WmOsFTYhS5z29hu/exec';
        const LIFF_ID = '2006389089-vKl4jzk9';

        // แสดงฟอร์มการจอง (Step 1) เมื่อเปิดหน้า
        document.getElementById('step1').style.display = 'block';
        showLoading(true);

        // โหลดข้อมูลเบื้องต้น เช่น รายการบริการ สถานที่ และ LIFF
        async function loadInitialData() {
            await Promise.all([fetchDropdownData(), initializeLiff()]);

            const currentDate = new Date();
            selectDate(currentDate.getFullYear(), currentDate.getMonth(), currentDate.getDate());
            populateYearSelect(currentDate.getFullYear());
            monthSelect.value = currentDate.getMonth();
            yearSelect.value = currentDate.getFullYear();

            await updateCalendar(currentDate);
            showLoading(false);
        }

        loadInitialData();

        // ฟังก์ชันการเตรียมการเริ่มต้น LIFF
        async function initializeLiff() {
            try {
                await liff.init({ liffId: LIFF_ID });
                if (liff.isLoggedIn()) {
                    getUserProfile();
                } else {
                    liff.login();
                }
            } catch (error) {
                console.error('Error initializing LIFF:', error);
            }
        }

// ฟังก์ชันดึงข้อมูลโปรไฟล์ผู้ใช้จาก LIFF
async function getUserProfile() {
    try {
        const profile = await liff.getProfile();
        // ใช้ชื่อจากไลน์แทนการให้กรอกชื่อ
        document.getElementById('displayName').value = profile.displayName;
        document.getElementById('userlineid').value = profile.userId;
        fetchData(profile.userId);
    } catch (error) {
        console.error('Error getting profile data:', error);
    }
}


        // ฟังก์ชันดึงข้อมูลผู้ใช้จากเซิร์ฟเวอร์
        async function fetchData(userId) {
            showLoading(true);
            try {
                const response = await fetch(WEB_APP_MEMBER_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'fetchData', userId: userId })
                });
                const data = await response.json();
                data.sort((a, b) => new Date(b[6]) - new Date(a[6]));
                const row = data.find(row => row[1] === userId);
                if (row) {
                    displayData(row);
                } else {
                    console.log('No data found for userId:', userId);
                }
            } catch (error) {
                console.error('Error fetching data:', error);
            } finally {
                showLoading(false);
            }
        }

        // แสดงข้อมูลผู้ใช้ในฟอร์ม
        function displayData(row) {
            document.getElementById('userlineid').value = row[1] || '';
            document.getElementById('name').value = row[2] || '';
            document.getElementById('emailaddress').value = row[4] || '';
            document.getElementById('phonenumber').value = row[3] || '';
        }

        // ฟังก์ชันแสดง/ซ่อนการโหลดข้อมูล
        function showLoading(isLoading) {
            const overlay = document.getElementById('loadingOverlay');
            const inputs = document.querySelectorAll('.input-field');
            overlay.style.display = isLoading ? 'flex' : 'none';
            inputs.forEach(input => input.disabled = isLoading);
        }

        let currentStep = 1;
        let selectedDate = '';
        let isSubmitting = false;

        // ฟังก์ชันเปลี่ยนขั้นตอนจาก Step 1 ไป Step 2
        function nextStep() {
    if (currentStep === 1) {
        const address = form.note.value.trim();
        if (!address) {
            showPopup('เกิดข้อผิดพลาด', 'กรุณากรอกข้อมูลที่อยู่ก่อน', 'error');
            return;
        }

        const phone = form.phonenumber.value.trim();
        const phonePattern = /^[0-9]{10}$/; // ตรวจสอบว่าเป็นตัวเลข 10 หลักตรงเป๊ะ

        if (!phonePattern.test(phone)) {
            showPopup('เกิดข้อผิดพลาด', 'กรุณากรอกเบอร์โทรให้ถูกต้อง (ตัวเลข 10 หลักติดกันเท่านั้น)', 'error');
            return;
        }
    }

    if (currentStep < 2) {
        document.getElementById(`step${currentStep}`).style.display = 'none';
        currentStep++;
        document.getElementById(`step${currentStep}`).style.display = 'block';
        if (currentStep === 2) {
            scrollToCurrentDay();
        }
    }
}


        // ฟังก์ชันย้อนกลับไปยัง Step ก่อนหน้า
        function prevStep() {
            if (currentStep > 1) {
                document.getElementById(`step${currentStep}`).style.display = 'none';
                currentStep--;
                document.getElementById(`step${currentStep}`).style.display = 'grid';
                if (currentStep === 2) {
                    scrollToCurrentDay();
                }
            }
        }

        // ฟังก์ชันดึงข้อมูลตัวเลือกบริการและสถานที่จากเซิร์ฟเวอร์
        async function fetchDropdownData() {
            try {
                const response = await fetch(`${WEB_APP_URL}?action=fetchServicesAndlocationservice`);
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                const data = await response.json();
                populateDropdown('service', data.services);
                populateDropdown('locationservice', data.locationservice);
            } catch (error) {
                console.error('There was a problem with the fetch operation:', error);
            }
        }

        // ฟังก์ชันเพิ่มรายการบริการและสถานที่ลงใน Dropdown
        function populateDropdown(dropdownId, items) {
            const dropdown = document.getElementById(dropdownId);
            dropdown.innerHTML = '';
            items.forEach(item => {
                const option = document.createElement('option');
                option.value = item;
                option.textContent = item;
                dropdown.appendChild(option);
            });
        }

        const form = document.getElementById('bookingForm');
        const monthSelect = document.getElementById('monthSelect');
        const yearSelect = document.getElementById('yearSelect');
        const calendarDays = document.getElementById('calendarDays');
        const availabilityDiv = document.getElementById('availability');
        const timeInput = document.getElementById('time');

        // อัปเดตปฏิทินเมื่อเลือกเดือนหรือปี
        monthSelect.addEventListener('change', () => updateCalendar(new Date(yearSelect.value, monthSelect.value)));
        yearSelect.addEventListener('change', () => updateCalendar(new Date(yearSelect.value, monthSelect.value)));

        const daysOfWeek = ['อา.', 'จ.', 'อ.', 'พ.', 'พฤ.', 'ศ.', 'ส.'];

        // ฟังก์ชันสร้างตัวเลือกปีใน Dropdown
        function populateYearSelect(currentYear) {
            yearSelect.innerHTML = '';
            for (let i = currentYear; i <= currentYear + 3; i++) {
                const option = document.createElement('option');
                option.value = i;
                option.textContent = i;
                yearSelect.appendChild(option);
            }
        }

        // อัปเดตปฏิทินตามวันที่ปัจจุบัน
        async function updateCalendar(date) {
            const month = date.getMonth();
            const year = date.getFullYear();
            populateDays(month, year, date.getDate());
        }

        // ฟังก์ชันเพิ่มวันในปฏิทิน
        function populateDays(month, year, currentDay) {
            calendarDays.innerHTML = '';
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            for (let day = 1; day <= daysInMonth; day++) {
                const date = new Date(year, month, day);
                const dayElement = document.createElement('div');
                dayElement.classList.add('bg-slate-800', 'px-6', 'py-3', 'mx-2', 'bg-white', 'border', 'border-slate-800', 'text-center', 'rounded-2xl', 'cursor-pointer');
                dayElement.textContent = `${daysOfWeek[date.getDay()]} ${day}`;
                if (day === currentDay) {
                    dayElement.id = 'currentDay';
                    dayElement.classList.add('selected');
                    selectDate(year, month, day);
                }
                dayElement.addEventListener('click', () => {
                    document.querySelectorAll('#calendarDays > div').forEach(el => el.classList.remove('selected'));
                    dayElement.classList.add('selected');
                    selectDate(year, month, day);
                });
                calendarDays.appendChild(dayElement);
            }
            scrollToCurrentDay();
        }

        // เลื่อนหน้าจอไปยังวันปัจจุบันในปฏิทิน
        function scrollToCurrentDay() {
            setTimeout(() => {
                const currentDayElement = document.getElementById('currentDay');
                if (currentDayElement) {
                    currentDayElement.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                }
            }, 100);
        }

        // ฟังก์ชันเลือกวันที่
        async function selectDate(year, month, day) {
            selectedDate = `${year}-${(month + 1).toString().padStart(2, '0')}-${day.toString().padStart(2, '0')}`;
            showLoading(true);
            try {
                const response = await fetch(`${WEB_APP_URL}?action=checkAvailability&date=${selectedDate}`);
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                const availability = await response.json();
                updateAvailability(availability);
            } catch (error) {
                console.error('There was a problem with the fetch operation:', error);
                showPopup('เกิดข้อผิดพลาด', 'ไม่สามารถโหลดข้อมูลได้ โปรดลองใหม่อีกครั้ง', 'error');
            } finally {
                showLoading(false);
            }
        }

        // อัปเดตการแสดงสถานะว่างของวันและเวลา
        function updateAvailability(availability) {
            availabilityDiv.innerHTML = '';
            for (const [time, info] of Object.entries(availability)) {
                const slotDiv = document.createElement('div');
                slotDiv.className = 'flex justify-between items-center py-2';

                const timeSpan = document.createElement('span');
                timeSpan.className = 'px-6 py-2 rounded-2xl bg-white text-slate-800';
                timeSpan.textContent = `${time} น.`;

                const statusButton = document.createElement('button');
                statusButton.className = `px-6 py-2 rounded-2xl ${info.status === 'Available' ? 'bg-green-200 text-green-600 cursor-not-allowed' : 'bg-red-200 text-red-600 cursor-not-allowed'}`;
                statusButton.textContent = info.status === 'Available' ? `ว่าง (${info.remaining}/${info.total})` : `เต็ม (${info.remaining}/${info.total})`;
                statusButton.disabled = true;

                const bookButton = document.createElement('button');
                bookButton.className = `custom-button px-4 py-2 rounded-2xl ${info.status === 'Available' ? 'bg-slate-800 text-white' : 'bg-gray-100 text-gray-400'}`;
                bookButton.innerHTML = `<i class="fas fa-calendar-alt"></i> กดจองคิว`;
                bookButton.disabled = info.status !== 'Available';
                bookButton.addEventListener('click', () => {
                    timeInput.value = time.padStart(5, '0');
                    showPopup('ยืนยันการนัดหมาย', `
                        <p>บริการ: ${form.service.value}</p>
                        <p>สาขา: ${form.locationservice.value}</p>
                        <p>ชื่อ: ${form.name.value}</p>
                        <p>เบอร์ติดต่อ: ${form.phonenumber.value}</p>
                        <p>ข้อมูลที่อยู่: ${form.note.value}</p>
                        <p>วันที่: ${selectedDate}</p>
                        <p>เวลา: ${timeInput.value}</p>
                    `, 'confirm');
                });

                slotDiv.appendChild(timeSpan);
                slotDiv.appendChild(statusButton);
                slotDiv.appendChild(bookButton);
                availabilityDiv.appendChild(slotDiv);
            }
        }

        // แสดง/ซ่อนแถบโหลดข้อมูล
        function showLoading(isLoading = true) {
            document.getElementById('loadingOverlay').style.display = isLoading ? 'flex' : 'none';
        }

        // ซ่อน Popup
        function hidePopup() {
            document.getElementById('popup').style.display = 'none';
        }

        // ฟังก์ชันส่งข้อมูลการจอง
        async function submitBooking() {
            if (isSubmitting) return;
            isSubmitting = true;
            showLoading(true);
            try {
                const formData = new FormData(form);
                formData.append('date', selectedDate);
                const response = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    body: formData
                });
                hidePopup();
                const result = await response.text();
                showPopup('สำเร็จ!', 'ขอบคุณครับ เดี๋ยวแอดมินจะมาคอร์นเฟิร์มคิวงานให้อีกทีนะครับ', 'success');
                liff.closeWindow();
            } catch (error) {
                console.error('There was a problem with the fetch operation:', error);
                showPopup('เกิดข้อผิดพลาด', 'ไม่สามารถส่งข้อมูลได้ โปรดลองใหม่อีกครั้ง', 'error');
            } finally {
                showLoading(false);
                isSubmitting = false;
            }
        }

        // ตรวจสอบการส่งฟอร์ม
        form.addEventListener('submit', (e) => {
    e.preventDefault();

    const phoneNumber = form.phonenumber.value.trim(); // ตัดช่องว่างหัว-ท้าย

    // ตรวจสอบว่าเป็นตัวเลขเท่านั้น และต้อง 10 หลักพอดี
    const phoneRegex = /^[0-9]{10}$/;

    if (!phoneRegex.test(phoneNumber)) {
        showPopup('เกิดข้อผิดพลาด', 'กรุณากรอกเบอร์โทรให้ถูกต้อง (ตัวเลข 10 หลักติดกันเท่านั้น)', 'error');
        return;
    }

    if (!selectedDate) {
        showPopup('เกิดข้อผิดพลาด', 'กรุณาเลือกวันที่', 'error');
        return;
    }
            showPopup('<p class="text-blue-900">📆 ยืนยันการนัดหมาย</p>', `
                <p>บริการ: ${form.service.value}</p>
                <p>สาขา: ${form.locationservice.value}</p>
                <p>ชื่อ: ${form.name.value}</p>
                <p>ข้อมูลที่อยู่: ${form.emailaddress.value}</p>
                <p>เบอร์ติดต่อ: ${form.phonenumber.value}</p>
                <p>หมายเหตุ: ${form.note.value}</p>
                <p>วันที่: ${selectedDate}</p>
                <p>เวลา: ${timeInput.value}</p>
            `, 'confirm');
        });

        // ฟังก์ชันแสดง Popup การยืนยันการนัดหมาย
        function showPopup(title, content, type) {
            const popup = document.getElementById('popup');
            const popupContent = document.getElementById('popupContent');
            popupContent.innerHTML = `<h2 class="text-xl mb-4">${title}</h2><div>${content}</div>`;
            if (type === 'confirm') {
                popupContent.innerHTML += `
                    <div class="flex justify-between my-4">
                        <button id="cancelButton" class="px-2 py-4 bg-gray-300 text-gray-700 rounded-2xl">ยกเลิก</button>
                        <button id="confirmButton" class="px-2 py-4 bg-slate-800 text-white rounded-2xl mr-2">ยืนยันนัดหมาย</button>
                    </div>
                `;
                document.getElementById('confirmButton').addEventListener('click', () => {
                    document.getElementById('confirmButton').innerText = 'กำลังบันทึก...';
                    submitBooking();
                });
                document.getElementById('cancelButton').addEventListener('click', hidePopup);
            } else {
                popupContent.innerHTML += `<div class="mt-4"><button onclick="hidePopup()" class="px-4 py-2 bg-gray-300 text-gray-700 rounded-2xl">ปิด</button></div>`;
            }
            popup.style.display = 'flex';
        }
// ⬇️ วางตรงนี้เลย
    document.addEventListener('DOMContentLoaded', async () => {
        await liff.init({ liffId: "2006389089-vKl4jzk9" }); // ใส่ LIFF ID จริงของคุณ

        if (!liff.isLoggedIn()) {
            liff.login();
            return;
        }

        const profile = await liff.getProfile();
        form.name.value = profile.displayName;
        form.name.readOnly = true;
    });
</script>
